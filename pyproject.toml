[project]
name = "oncoimmuno-rag"
version = "0.1.0"
description = "RAG system for oncology immunotherapy literature: PDF ingestion, vector retrieval, evidence grading, and evaluation."
authors = [
    { name = "OncoImmunoRAG" }
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"

dependencies = [
    "llama-index>=0.12.0,<1.0.0",
    # 0.6.0+ relaxes the pandas<2.3.0 pin, which is required for Python 3.14 wheels.
    "llama-index-readers-file>=0.6.0,<1.0.0",
    "chromadb>=0.5.0,<1.0.0",
    # pypdf 6.x ships cp314 wheels; 5.x tops out at cp313.
    "pypdf>=6.0.0,<7.0.0",
    # pandas 2.3+ ships cp314 wheels; 2.2.x tops out at cp313.
    "pandas>=2.3.0,<4.0.0",
    "openai>=1.50.0,<2.0.0",
    "llama-index-embeddings-huggingface (>=0.7.0,<0.8.0)",
    "sentence-transformers (>=5.6.1,<6.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    # Required by the Chroma vector-store backend imported in
    # ingestion/vector_store.py, ingestion/append_pdfs.py,
    # retrieval/query_engine.py and retrieval/temp_indexer.py.
    # 0.6.0 requires llama-index-core>=0.13,<0.15 and chromadb>=0.5.17,
    # both of which the existing lock already satisfies.
    "llama-index-vector-stores-chroma>=0.6.0,<1.0.0",
    # Required by app.py (the Streamlit front-end).
    "streamlit>=1.60.0,<2.0.0",
    # Directly imported by retrieval/pubmed_client.py (NCBI E-utilities client).
    # It was previously only present as a transitive dependency, which is not a
    # guarantee — any upstream package dropping it would break PubMed search.
    # Already resolved at 2.34.2 in poetry.lock; this only makes the dependency
    # explicit, it does not change the resolved version.
    "requests>=2.31.0,<3.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# src layout: ingestion / retrieval / grading / evaluation are sibling top-level
# packages living under src/. Each has its own __init__.py. We use Poetry purely
# for dependency management, so disable project-as-package installation.
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
pytest-cov = ">=5.0.0,<7.0.0"
ruff = ">=0.6.0,<1.0.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=oncoimmuno_rag --cov-report=term-missing"
markers = [
    "unit: pure logic, no I/O, no credentials, no network",
    "contract: interface shape (field names, types, exception types, data flow)",
    "integration: multi-module flow over synthetic inputs",
    "requires_api: needs a live LLM credential (OPENAI_API_KEY)",
    "requires_model: needs the 1.3 GB BAAI/bge-large-en-v1.5 embedding model",
    "requires_network: needs outbound internet (NCBI / HuggingFace / LLM)",
    "requires_gpu: needs a CUDA-capable GPU",
]
